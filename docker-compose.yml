
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: urban-heat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: urban_heat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./data/seeds/buildings.sql:/docker-entrypoint-initdb.d/02-buildings.sql
      - ./data/seeds/environmental_readings.sql:/docker-entrypoint-initdb.d/03-environmental_readings.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d urban_heat"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  server:
    build: ./server
    container_name: urban-heat-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/urban_heat
      QUANT_SERVICE_URL: http://quant-service:8000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server:/app
      - /app/node_modules

  quant-service:
    build: ./quant-service
    container_name: urban-heat-quant
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
    volumes:
      - ./quant-service:/app

  client:
    build: ./client
    container_name: urban-heat-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3001
      VITE_QUANT_URL: http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
      - quant-service

volumes:
  postgres-data: